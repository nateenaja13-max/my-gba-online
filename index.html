<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA ARCADE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/gbajs/dist/index.js"></script>
    <style>
        body { background-color: #0a0a0a; color: white; }
        .gamer-border { border: 2px solid #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        .game-btn { background: #1a1a1a; border-left: 4px solid #ff0000; transition: 0.3s; width: 100%; text-align: left; padding: 1rem; font-weight: bold; }
        .game-btn:hover { background: #ff0000; color: white; }
    </style>
</head>
<body class="font-sans">

    <nav class="p-5 border-b-2 border-red-600 mb-5">
        <h1 class="text-3xl font-black italic text-red-600 text-center">GBA <span class="text-white">ARCADE</span></h1>
    </nav>

    <div class="container mx-auto flex flex-col md:flex-row gap-8 px-4">
        
        <!-- ส่วนหน้าจอเกม -->
        <div class="flex-1 flex flex-col items-center">
            <div class="w-full max-w-2xl aspect-[3/2] bg-black gamer-border rounded-lg relative overflow-hidden">
                <canvas id="screen"></canvas>
                <div id="msg" class="absolute inset-0 flex items-center justify-center text-red-600 font-bold bg-black">
                    รอกดเลือกเกมด้านขวามือ
                </div>
            </div>
            <p class="mt-4 text-zinc-500 text-xs">Z=A | X=B | Enter=Start | Arrows=Move</p>
        </div>

        <!-- ส่วนรายชื่อเกม (Arcade Cabinet) -->
        <div class="w-full md:w-80 flex flex-col gap-4">
            <h2 class="text-xl font-bold border-b border-zinc-800 pb-2 text-red-500 uppercase">Arcade Cabinet</h2>
            
            <!-- ปุ่มโหลดเกม Pokemon ที่นายอัปโหลดไว้ -->
            <button onclick="loadGame('firered.gba')" class="game-btn">
                PLAY POKEMON FIRE RED
            </button>

        </div>
    </div>

    <script>
        const gba = new GameBoyAdvance();
        const canvas = document.getElementById('screen');
        gba.setCanvas(canvas);

        function loadGame(fileName) {
            document.getElementById('msg').innerText = "LOADING...";
            fetch(fileName)
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    gba.loadRom(buffer, (success) => {
                        if (success) {
                            document.getElementById('msg').classList.add('hidden');
                            gba.runAnimation();
                        } else {
                            alert("โหลดเกมไม่สำเร็จ ตรวจสอบชื่อไฟล์บน GitHub");
                        }
                    });
                });
        }
    </script>
</body>
</html>
