<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBA CLOUD PLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดเครื่องยนต์เล่นเกม GBA -->
    <script src="https://unpkg.com/gbajs/dist/index.js"></script>
    <style>
        body { background-color: #0a0a0a; color: white; }
        .gamer-border { border: 2px solid #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
</head>
<body class="font-sans">

    <nav class="p-5 border-b-2 border-red-600 flex justify-between items-center shadow-lg">
        <h1 class="text-3xl font-black italic text-red-600 tracking-tighter">GBA <span class="text-white">CLOUD</span></h1>
        <div class="text-xs border border-red-600 px-3 py-1 text-red-500">ENGINE READY</div>
    </nav>

    <div class="container mx-auto mt-10 flex flex-col items-center px-4">
        <!-- หน้าจอเกม -->
        <div class="w-full max-w-2xl aspect-[3/2] bg-black gamer-border rounded-lg relative overflow-hidden">
            <canvas id="screen"></canvas>
            <div id="placeholder" class="absolute inset-0 flex items-center justify-center text-red-600 font-bold bg-black">
                <p>กดปุ่ม UPLOAD ROM เพื่อเริ่มเล่น</p>
            </div>
        </div>

        <!-- ปุ่มกด -->
        <div class="mt-8 grid grid-cols-1 gap-4 w-full max-w-md">
            <label class="bg-red-600 text-white text-center p-4 rounded cursor-pointer font-bold hover:bg-red-700 transition shadow-lg">
                UPLOAD ROM (.gba)
                <input type="file" id="upload" class="hidden" accept=".gba">
            </label>
        </div>

        <div class="mt-10 p-4 bg-zinc-900 border-l-4 border-red-600 w-full max-w-2xl">
            <p class="text-red-500 font-bold mb-2">วิธีควบคุม:</p>
            <p class="text-zinc-400 text-sm">ปุ่มลูกศร = บังคับทิศทาง | Z = ปุ่ม A | X = ปุ่ม B</p>
            <p class="text-zinc-400 text-sm">Enter = Start | Shift = Select</p>
        </div>
    </div>

    <script>
        // ตั้งค่าเครื่องเล่นเกม
        const gba = new GameBoyAdvance();
        const canvas = document.getElementById('screen');
        gba.setCanvas(canvas);

        // เมื่อเราเลือกไฟล์เกมจากเครื่อง
        document.getElementById('upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // ซ่อนข้อความเริ่มต้น
                document.getElementById('placeholder').style.display = 'none';
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    // โหลดไฟล์เกมเข้าเครื่องยนต์
                    gba.loadRom(event.target.result, function(success) {
                        if (success) {
                            gba.runAnimation(); // เริ่มเล่นเกม!
                        } else {
                            alert('โหลดเกมไม่สำเร็จ ลองไฟล์อื่นดูนะ');
                        }
                    });
                };
                reader.readAsArrayBuffer(file);
            }
        });
    </script>
</body>
</html>
